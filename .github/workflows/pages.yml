name: Publish depth viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data_only:
        description: 'Refresh verified snapshots without rediscovering the market catalog'
        type: boolean
        default: false
  workflow_run:
    workflows: [Refresh ESIM report, Refresh ESIM holders]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - if: github.event_name != 'workflow_run' && inputs.refresh_data_only != true
        run: npm run catalog
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          ref: esim-cache
          path: .goodway/pages-report
      - uses: actions/checkout@v4
        with:
          ref: holder-cache
          path: .goodway/pages-holders
      - name: Include verified ESIM snapshots on the website
        run: node scripts/esim/stage-snapshots.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
