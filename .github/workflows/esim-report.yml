name: Refresh ESIM report
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
concurrency:
  group: esim-report-checkpoint
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Query only ESIM incremental activity
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ESIM_REMOTE_START: 'true'
          ESIM_RPC_BUDGET: '600'
        run: node scripts/esim/refresh.mjs
      - name: Publish verified checkpoint
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f .goodway/esim-monitor/state.json.gz ]; then
            node scripts/esim/publish.mjs
          fi
