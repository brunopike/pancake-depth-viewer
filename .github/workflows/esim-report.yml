name: Refresh ESIM report
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Bounded session minutes (1–300); following sessions use 300'
        default: '300'
        required: false
        type: string
  schedule:
    # Recovery only; the active worker owns the hourly timer and session handoff.
    - cron: '41 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: esim-report-checkpoint
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Load the latest verified checkpoint directly
        uses: actions/checkout@v4
        with:
          ref: esim-cache
          path: .goodway/checkpoint
          sparse-checkout: state.json.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Keep ESIM transactions and holders current every 60 minutes
        env:
          ESIM_CHECKPOINT_FILE: .goodway/checkpoint/state.json.gz
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SESSION_MINUTES: ${{ inputs.session_minutes || '300' }}
        run: node scripts/esim/hourly-worker.mjs
