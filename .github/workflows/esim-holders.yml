name: Refresh ESIM holders
on:
  workflow_dispatch:
  # Manual recovery; the report worker owns the hourly holder refresh.
permissions:
  contents: write
concurrency:
  group: esim-holders-checkpoint
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load the latest verified checkpoint directly
        uses: actions/checkout@v4
        with:
          ref: esim-cache
          path: .goodway/checkpoint
          sparse-checkout: state.json.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read only ESIM balances and transfers
        env:
          ESIM_CHECKPOINT_FILE: .goodway/checkpoint/state.json.gz
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ESIM_REALTIME_DATABASE_URL: ${{ secrets.ESIM_REALTIME_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/esim/run-with-lease.mjs core scripts/esim/holders-job.mjs
