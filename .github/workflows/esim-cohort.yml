name: Verify ESIM cohort balances
on:
  workflow_dispatch:
  schedule:
    - cron: '32 * * * *'
permissions:
  contents: write
concurrency:
  group: esim-cohort-checkpoint
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: esim-cache
          path: .goodway/checkpoint
          sparse-checkout: |
            state.json.gz
            claim-flow-state.json.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .goodway/claim-flow/rpc-cache
          key: esim-claim-flow-rpc-v1-${{ github.run_id }}
          restore-keys: esim-claim-flow-rpc-v1-
      - name: Verify balances and stake receipts
        env:
          ESIM_CHECKPOINT_FILE: .goodway/checkpoint/state.json.gz
          ESIM_FLOW_CHECKPOINT_FILE: .goodway/checkpoint/claim-flow-state.json.gz
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ESIM_REALTIME_DATABASE_URL: ${{ secrets.ESIM_REALTIME_DATABASE_URL }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: node scripts/esim/run-with-lease.mjs cohort scripts/esim/cohort-refresh.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-esim-cohort
          path: .goodway/cohort/cohort.json
          if-no-files-found: error
          retention-days: 3
