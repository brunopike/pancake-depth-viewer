name: Refresh ESIM claim flow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 03d95f8300353c74a11ee302e4b787bb533fa1e8
          path: .goodway/checkpoint
          sparse-checkout: |
            state.json.gz
            claim-flow-state.json.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/contract-cohort.test.mjs tests/claim-flow-collector.test.mjs
      - uses: actions/cache@v4
        with:
          path: .goodway/claim-flow/rpc-cache
          key: esim-cohort-audit-20261028
          restore-keys: esim-claim-flow-rpc-v1-
      - run: node scripts/esim/cohort-audit.mjs
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          NODE_OPTIONS: '--max-old-space-size=6144'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-contract-cohort
          path: .goodway/cohort-result
          retention-days: 7
