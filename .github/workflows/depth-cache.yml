name: Refresh selected market depth
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Worker session minutes (1–330); subsequent sessions use 330'
        default: '330'
        required: false
        type: string
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: shared-esim-depth
  cancel-in-progress: false
jobs:
  snapshot:
    # Standard public-repository runners are free; do not start this loop after a privacy change.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check private Alchemy configuration
        id: config
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          if [ -n "$ALCHEMY_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Alchemy is not configured; the existing snapshot is preserved.'
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.config.outputs.configured == 'true'
      - name: Keep the hourly validated snapshot worker running
        if: steps.config.outputs.configured == 'true'
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESIM_REALTIME_DATABASE_URL: ${{ secrets.ESIM_REALTIME_DATABASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SESSION_MINUTES: ${{ inputs.session_minutes || '330' }}
        run: node scripts/esim/run-with-lease.mjs depth scripts/hourly-worker.mjs
